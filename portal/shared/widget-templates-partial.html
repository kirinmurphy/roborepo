<!-- Templates for shared/*.js custom elements (option-dropdown, token-chip, menu-button,
     copy-button, close-button, notice). Injected into every page via {{WIDGET_TEMPLATES}} —
     same pattern as chrome-partial.html — so each element's render() clones real <template>
     markup instead of hand-assembling nested DOM with chained createElement calls. -->

<!-- option-dropdown.js -->
<template id="tpl-dropdown-trigger">
  <button type="button" class="dropdown-trigger" aria-haspopup="listbox"></button>
</template>
<template id="tpl-dropdown-spinner">
  <span class="spinner"></span>
</template>
<template id="tpl-dropdown-chevron">
  <span class="dropdown-chevron" aria-hidden="true">▾</span>
</template>
<template id="tpl-dropdown-menu">
  <div class="dropdown-menu" role="listbox"></div>
</template>
<template id="tpl-dropdown-option">
  <button type="button" class="dropdown-option" role="option" data-slot="label"></button>
</template>

<!-- token-chip.js -->
<template id="tpl-token-chip">
  <span class="token-chip" data-slot="text"></span>
</template>
<template id="tpl-chip-info-icon">
  <span class="chip-info" aria-hidden="true">ⓘ</span>
</template>
<template id="tpl-chip-tip">
  <span class="chip-tip" hidden></span>
</template>
<template id="tpl-chip-tip-head">
  <span class="chip-tip-head" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-note">
  <span class="chip-tip-note" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-table">
  <span class="chip-tip-table"></span>
</template>
<template id="tpl-chip-tip-cell">
  <span class="chip-tip-cell" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-legend">
  <span class="chip-tip-legend"></span>
</template>
<template id="tpl-chip-tip-legend-line">
  <span class="chip-tip-legend-line">
    <span class="chip-tip-dot" data-slot="dot"></span
    ><span data-slot="text"></span>
  </span>
</template>
<template id="tpl-chip-tip-foot">
  <span class="chip-tip-foot">Estimated: ~4 characters ≈ 1 token</span>
</template>

<!-- menu-button.js -->
<template id="tpl-menu-button-trigger">
  <button type="button" class="menu-button-trigger" aria-haspopup="true"></button>
</template>
<template id="tpl-menu-button-panel">
  <div class="menu-button-panel"></div>
</template>

<!-- copy-menu.js — icon-only copy trigger + caret, opening a list of copy actions. The trigger
     carries no text label: the copy glyph names the action, and the items inside say what each
     one copies, so a "Copy" word on the trigger only repeated the first word of every item. -->
<template id="tpl-copy-menu-trigger">
  <button type="button" class="copy-menu-trigger" aria-haspopup="true" aria-label="Copy">
    <portal-icon data-slot="icon" name="copy" size="lg"></portal-icon
    ><portal-icon name="chevron" size="sm" class="copy-menu-chevron"></portal-icon>
    <!-- Copied confirmation is an IN-PLACE face swap (copy glyph → check, same box), matching
         portal-copy-button — no overlay element, no alignment drift. copy-menu.js owns the swap;
         .copy-menu-trigger.copied in base.css owns the color. -->
  </button>
</template>
<template id="tpl-copy-menu-panel">
  <div class="copy-menu-panel"></div>
</template>
<template id="tpl-copy-menu-item">
  <button type="button" class="copy-menu-item"><span data-slot="label"></span></button>
</template>

<!-- copy-button.js -->
<template id="tpl-copy-button">
  <button type="button" class="copy-button">
    <span class="copy-button-state" data-slot="idle">
      <portal-icon data-slot="icon" size="sm"></portal-icon
      ><span data-slot="label"></span>
    </span>
    <!-- Copied state is an IN-PLACE face swap (icon → check, label → "Copied") inside this same
         button box — no overlay element, so the wrapper never moves and alignment can't drift.
         copy-button.js owns the swap; .copy-button-copied in base.css owns the color. -->
  </button>
</template>

<!-- close-button.js -->
<template id="tpl-close-button">
  <button type="button" class="close-button">
    <portal-icon name="close" size="sm"></portal-icon>
  </button>
</template>

<!-- notice.js -->
<template id="tpl-notice-icon">
  <span data-notice-icon="" aria-hidden="true">
    <portal-icon data-slot="icon" size="xl"></portal-icon>
  </span>
</template>

<!-- harness-warning.js — the shared "install a supported harness" banner, rendered by
     harnessWarningElement() on any page (Agents + Tokens). One template so the two pages can
     never drift. -->
<template id="tpl-harness-warning">
  <portal-notice aria-live="polite">
    <div class="config-empty">
      <strong data-slot="title"></strong>
      <span data-slot="body"></span>
    </div>
  </portal-notice>
</template>
