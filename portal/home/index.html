<!doctype html>
<html lang="en">
  {{HEAD}}
  <body>
    {{CHROME}}
    {{WIDGET_TEMPLATES}}
    <main id="main" class="inner home-main">
      {{LOADING}}
      <section class="home-heading" aria-labelledby="home-title">
        <div>
          <p class="home-eyebrow">Workspace</p>
          <h1 id="home-title">Repositories</h1>
          <p>Open a running checkout, or see what needs attention across your current work.</p>
        </div>
        <div class="home-action-slot" aria-hidden="true"></div>
      </section>
      <section id="home-warning" class="notice warn" hidden></section>
      <section id="home-content" aria-live="polite"></section>
    </main>

    <template id="tpl-home-empty">
      <section class="home-empty">
        <h2 data-slot="title"></h2>
        <p data-slot="body"></p>
        <a href="/runtime">Open Runtime</a>
      </section>
    </template>
    <template id="tpl-repository-directory">
      <div class="repository-directory" data-slot="repositories"></div>
    </template>
    <template id="tpl-repository-card">
      <article class="repository-card">
        <header class="repository-card-head">
          <div>
            <div class="repository-title-line">
              <h2 data-slot="name"></h2>
              <span class="repository-lifecycle" data-slot="lifecycle"></span>
            </div>
            <p class="repository-meta" data-slot="meta"></p>
          </div>
          <a class="repository-detail-link" data-slot="detail-link">View repository <span aria-hidden="true">→</span></a>
        </header>
        <div class="checkout-list" data-slot="checkouts"></div>
        <dl class="domain-grid" data-slot="domains"></dl>
      </article>
    </template>
    <template id="tpl-checkout-row">
      <div class="checkout-row">
        <span class="checkout-name" data-slot="name"></span>
        <span class="checkout-git" data-slot="git"></span>
        <span class="checkout-entrypoint" data-slot="entrypoint"></span>
      </div>
    </template>
    <template id="tpl-checkout-overflow">
      <details class="checkout-overflow">
        <summary data-slot="summary"></summary>
        <div data-slot="rows"></div>
      </details>
    </template>
    <template id="tpl-domain-row">
      <div class="domain-row">
        <dt data-slot="label"></dt>
        <dd><span class="domain-status" data-slot="status"></span><span data-slot="summary"></span></dd>
      </div>
    </template>
    <template id="tpl-unresolved-activity">
      <aside class="unresolved-activity">
        <div><strong>Unresolved Runtime activity</strong><p data-slot="summary"></p></div>
        <a href="/runtime">Associate in Runtime</a>
      </aside>
    </template>

    <script src="/portal/shared/icon.js" type="module"></script>
    <script src="/portal/shared/theme.js" type="module"></script>
    <script src="/portal/home/app.js" type="module"></script>
  </body>
</html>
